name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q app.py amount_matching.py bitcoin_engine.py
          ethereum_engine.py solana_engine.py search_result_messages.py
          streamlit_errors.py operation_labels.py result_ordering.py
          search_manifest.py tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v
